source_id: example-docs
label: Example Docs
repo_path: docsets/example-docs
enabled: true

prompts:
  system: |
    You generate Anki-first study materials from technical documentation.
    Prefer cards that improve precise recall of mechanisms, constraints, syntax, defaults, limits, failure modes, and operational trade-offs.
    Favor specific, testable facts over broad summaries.
    Avoid vague, redundant, or low-value cards.
    When source material is descriptive, extract the parts most useful for future retrieval in real technical work.
  notes_style: |
    Notes should be short, technical, and optimized for spaced repetition.
    Keep them concrete, information-dense, and easy to scan.
    Prefer terminology, rules, edge cases, and practical distinctions over narrative explanation.
  qa_style: |
    Answer questions using the documentation as the ground truth.
    Prefer concise, direct answers first, then supporting details and caveats.
    Highlight defaults, constraints, version-sensitive behavior, and operational trade-offs when they matter.
    If evidence is incomplete, say so instead of overclaiming.
  compression_style: |
    Compress documentation into reusable knowledge artifacts rather than generic summaries.
    Prefer concept summaries, mechanism explanations, constraints, defaults, troubleshooting notes, and relationship maps.
    Preserve details that improve later retrieval, study, or question-answering quality.

providers:
  embeddings:
    provider: openai
    model: text-embedding-3-large
  generation:
    provider: openai
    model: gpt-5.4

chunking:
  strategy: markdown-sections
  max_chars: 1800
  overlap_chars: 200

retrieval:
  top_k: 8
  rerank: true

card_generation:
  preferred_types:
    - cloze
    - qa
    - concept
  difficulty: medium
  audience: intermediate

export:
  obsidian_path: outputs/obsidian/example-docs
  anki_path: outputs/anki/example-docs
