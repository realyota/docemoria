source_id: example-docs
label: Example Docs
repo_path: docsets/example-docs
enabled: true

prompts:
  system: |
    You generate study materials based on this documentation.
    Prefer precise, practical, and unambiguous cards.
    Avoid generic notes and cards with little review value.
  notes_style: |
    Notes should be short, concrete, and optimized for later recall.

providers:
  embeddings:
    provider: openai
    model: text-embedding-3-large
  generation:
    provider: openai
    model: gpt-5.4

chunking:
  strategy: markdown-sections
  max_chars: 1800
  overlap_chars: 200

retrieval:
  top_k: 8
  rerank: true

card_generation:
  preferred_types:
    - cloze
    - qa
    - concept
  difficulty: medium
  audience: intermediate

export:
  obsidian_path: outputs/obsidian/example-docs
  anki_path: outputs/anki/example-docs
